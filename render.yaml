services:
  # ── Backend Web Service (Node.js + Express) ────────────
  - type: web
    name: ems-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Paste your MongoDB Atlas URI in Render dashboard
      - key: CLIENT_ORIGIN
        value: "*"

  # ── Frontend Static Site (Vite React) ──────────────────
  - type: web
    name: ems-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set in Render dashboard: https://ems-backend.onrender.com/api
